<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img" aria-labelledby="title desc">
  <title id="title">UR3 joint layout, J0 to J5</title>
  <desc id="desc">Simplified side view of a six-joint UR3 arm: base J0, shoulder J1, elbow J2, wrist 1 J3, wrist 2 J4, wrist 3 J5, ending in a gripper.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
    .ink { fill: #0b0b0b; font-weight: 600; }
    .muted { fill: #52514e; font-size: 11.5px; }
    .link { stroke: #c3c2b7; stroke-linecap: round; fill: none; }
    .body { fill: #c3c2b7; }
    .lead { stroke: #898781; stroke-width: 1; fill: none; }
    .ground { stroke: #898781; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f0efec; }
      .muted { fill: #c3c2b7; }
      .link { stroke: #5f5e5a; }
      .body { fill: #5f5e5a; }
    }
  </style>

  <!-- ground and pedestal -->
  <line class="ground" x1="40" y1="318" x2="600" y2="318"/>
  <rect class="body" x="92" y="262" width="56" height="56" rx="6"/>

  <!-- links -->
  <line class="link" x1="120" y1="222" x2="120" y2="262" stroke-width="20"/>
  <line class="link" x1="120" y1="222" x2="290" y2="96" stroke-width="18"/>
  <line class="link" x1="290" y1="96" x2="470" y2="140" stroke-width="15"/>
  <line class="link" x1="470" y1="140" x2="470" y2="226" stroke-width="12"/>

  <!-- gripper -->
  <rect class="body" x="455" y="238" width="30" height="9" rx="2"/>
  <line class="link" x1="460" y1="247" x2="460" y2="268" stroke-width="5"/>
  <line class="link" x1="480" y1="247" x2="480" y2="268" stroke-width="5"/>

  <!-- joints, coloured as in the notebook's per-joint plots -->
  <ellipse cx="120" cy="262" rx="36" ry="8" fill="none" stroke="#2a78d6" stroke-width="2.5"/>
  <path d="M150 266 l8 -1 l-5 6 z" fill="#2a78d6"/>
  <circle cx="120" cy="222" r="16" fill="#eb6834"/>
  <circle cx="290" cy="96" r="16" fill="#1baf7a"/>
  <circle cx="470" cy="140" r="13" fill="#eda100"/>
  <circle cx="470" cy="184" r="13" fill="#e87ba4"/>
  <circle cx="470" cy="226" r="11" fill="#008300"/>

  <!-- labels -->
  <line class="lead" x1="160" y1="290" x2="196" y2="290"/>
  <text class="ink" x="202" y="287">J0 · base</text>
  <text class="muted" x="202" y="303">turns the whole arm about the vertical axis</text>

  <text class="ink" x="96" y="200" text-anchor="end">J1 · shoulder</text>
  <text class="muted" x="96" y="215" text-anchor="end">lifts the full arm</text>

  <text class="ink" x="290" y="58" text-anchor="middle">J2 · elbow</text>
  <text class="muted" x="290" y="73" text-anchor="middle">lifts the forearm</text>

  <line class="lead" x1="487" y1="140" x2="508" y2="140"/>
  <text class="ink" x="514" y="144">J3 · wrist 1</text>
  <line class="lead" x1="487" y1="184" x2="508" y2="184"/>
  <text class="ink" x="514" y="188">J4 · wrist 2</text>
  <line class="lead" x1="485" y1="226" x2="508" y2="226"/>
  <text class="ink" x="514" y="230">J5 · wrist 3</text>
  <line class="lead" x1="490" y1="258" x2="508" y2="258"/>
  <text class="ink" x="514" y="262">gripper</text>
  <text class="muted" x="514" y="277">Tool_current</text>

  <text class="muted" x="40" y="350">Simplified side view, not to scale. J0–J5 are the suffixes of the dataset's Current_, Temperature_ and Speed_ columns.</text>
</svg>
